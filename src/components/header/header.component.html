<header class="sticky top-0 z-50 bg-black/80 backdrop-blur-md">
  <nav class="container mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <div class="flex items-center">
        <button (click)="logoClicked.emit()" class="text-2xl font-bold text-gray-100 tracking-tighter">Costura Fina</button>
      </div>
      
      <!-- Desktop Menu -->
      <div class="hidden md:flex items-center space-x-2">
        @if (!authService.isLoggedIn()) {
          <button (click)="authClicked.emit()" class="text-gray-300 hover:text-white px-4 py-2 rounded-full text-sm font-medium transition-colors hover:bg-zinc-800">
            Entrar / Cadastrar
          </button>
        }
      </div>

      <div class="flex items-center">
        @if (authService.isLoggedIn()) {
          <!-- Profile Button (Logged In) -->
          <button (click)="profileClicked.emit()" class="p-2 rounded-full text-gray-300 hover:text-white hover:bg-zinc-800 transition-colors">
            <span class="sr-only">Abrir menu de usuário</span>
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
            </svg>
          </button>
        }

         <!-- Wishlist Button -->
         <button (click)="wishlistClicked.emit()" class="relative p-2 rounded-full text-gray-300 hover:text-white hover:bg-zinc-800 transition-colors ml-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 016.364 0L12 7.66l1.318-1.342a4.5 4.5 0 116.364 6.364L12 20.364l-7.682-7.682a4.5 4.5 0 010-6.364z" />
            </svg>
            @if (wishlistService.totalItems() > 0) {
              <span class="absolute top-0 right-0 block h-4 w-4 rounded-full bg-blue-600 text-white text-[10px] font-bold text-center leading-4 ring-2 ring-black">
                {{ wishlistService.totalItems() }}
              </span>
            }
         </button>

         <!-- Cart Button -->
         <button (click)="cartClicked.emit()" class="relative p-2 rounded-full text-gray-300 hover:text-white hover:bg-zinc-800 transition-colors ml-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
            @if (cartService.totalItems() > 0) {
              <span class="absolute top-0 right-0 block h-4 w-4 rounded-full bg-blue-600 text-white text-[10px] font-bold text-center leading-4 ring-2 ring-black">
                {{ cartService.totalItems() }}
              </span>
            }
         </button>

         <!-- Mobile Menu Button -->
         <div class="md:hidden ml-2">
            <button (click)="toggleMobileMenu()" type="button" class="inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-white hover:bg-zinc-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-black focus:ring-white" aria-controls="mobile-menu" aria-expanded="false">
              <span class="sr-only">Abrir menu principal</span>
              @if (!isMobileMenuOpen()) {
                <!-- Icon when menu is closed. -->
                <svg class="block h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
              } @else {
                <!-- Icon when menu is open. -->
                <svg class="block h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
              }
            </button>
         </div>

      </div>
    </div>
  </nav>

  <!-- Mobile menu, show/hide based on menu state. -->
  @if (isMobileMenuOpen()) {
    <div class="md:hidden" id="mobile-menu">
      <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
        @if (authService.isLoggedIn()) {
          <button (click)="onProfileClick()" class="text-gray-300 hover:bg-zinc-800 hover:text-white block w-full text-left px-3 py-2 rounded-md text-base font-medium">Minha Conta</button>
        } @else {
          <button (click)="onAuthClick()" class="text-gray-300 hover:bg-zinc-800 hover:text-white block w-full text-left px-3 py-2 rounded-md text-base font-medium">Entrar / Cadastrar</button>
        }
      </div>
    </div>
  }
</header>
