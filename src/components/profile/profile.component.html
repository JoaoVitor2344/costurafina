<div 
  id="profile-backdrop"
  (click)="onBackdropClick($event)"
  class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm transition-opacity duration-300 ease-in-out"
  [class.opacity-100]="isOpen()"
  [class.opacity-0]="!isOpen()"
  [class.pointer-events-none]="!isOpen()">
  
  <div 
    class="fixed top-0 right-0 h-full w-full max-w-sm bg-zinc-900 shadow-2xl flex flex-col transition-transform duration-300 ease-in-out"
    [class.translate-x-0]="isOpen()"
    [class.translate-x-full]="!isOpen()">
    
    <!-- Header -->
    <div class="flex items-center justify-between p-6 border-b border-zinc-800">
      <h2 class="text-xl font-bold text-white">Minha Conta</h2>
      <button (click)="close.emit()" class="text-gray-400 hover:text-white transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    @if (authService.currentUser(); as user) {
      <!-- User Info -->
      <div class="p-6 flex items-center">
          <div class="w-16 h-16 rounded-full bg-gradient-to-tr from-blue-500 to-purple-600 flex items-center justify-center text-2xl font-bold text-white">
              {{ user.name.charAt(0) }}
          </div>
          <div class="ml-4">
              <p class="text-lg font-semibold text-white">{{ user.name }}</p>
              <p class="text-sm text-gray-400">{{ user.email }}</p>
          </div>
      </div>

      <!-- Menu -->
      <div class="flex-grow p-6 space-y-2">
          <button (click)="onOrderHistory()" class="w-full flex items-center px-4 py-3 rounded-lg text-left text-gray-300 hover:bg-zinc-800 hover:text-white transition-colors">
               <svg class="w-6 h-6 mr-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
              <span>Meus Pedidos</span>
          </button>
          <button (click)="onAddressBook()" class="w-full flex items-center px-4 py-3 rounded-lg text-left text-gray-300 hover:bg-zinc-800 hover:text-white transition-colors">
               <svg class="w-6 h-6 mr-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" /></svg>
              <span>Endereços</span>
          </button>
          <button (click)="onSupport()" class="w-full flex items-center px-4 py-3 rounded-lg text-left text-gray-300 hover:bg-zinc-800 hover:text-white transition-colors">
              <svg class="w-6 h-6 mr-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
              <span>Suporte</span>
          </button>
      </div>

      <!-- Footer -->
      <div class="border-t border-zinc-800 p-6">
          <button (click)="logout()" class="w-full flex items-center justify-center rounded-full border border-zinc-700 bg-zinc-800 px-6 py-3 text-base font-bold text-white shadow-sm hover:bg-zinc-700 transition-colors">
              Sair
          </button>
      </div>
    }
  </div>
</div>
