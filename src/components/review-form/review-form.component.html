<div class="bg-zinc-800 p-6 rounded-lg mt-6 border border-zinc-700 animate-fade-in">
  <h3 class="text-lg font-semibold text-white mb-4">Escreva sua Avaliação</h3>
  <div class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-300 mb-2">Sua Nota</label>
      <div class="flex items-center space-x-1" (mouseleave)="setHoverRating(0)">
        @for (i of [1, 2, 3, 4, 5]; track i) {
          <button
            type="button"
            (click)="setRating(i)"
            (mouseenter)="setHoverRating(i)"
            [attr.aria-label]="'Avaliar com ' + i + ' de 5 estrelas'">
            <svg [class]="'w-7 h-7 transition-colors ' + ((hoverRating() >= i || rating() >= i) ? 'text-yellow-400' : 'text-gray-600 hover:text-yellow-300')" fill="currentColor" viewBox="0 0 20 20">
              <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
            </svg>
          </button>
        }
      </div>
    </div>
    <div>
      <label for="comment" class="block text-sm font-medium text-gray-300">Sua Avaliação</label>
      <textarea 
        id="comment" 
        rows="4"
        [value]="comment()"
        (input)="onCommentInput($event)"
        placeholder="Compartilhe sua opinião sobre o produto..."
        class="mt-1 block w-full bg-zinc-700 border-zinc-600 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 text-white p-3"></textarea>
    </div>
    <div class="flex justify-end space-x-4">
      <button 
        type="button" 
        (click)="close.emit()"
        class="px-5 py-2 text-sm font-medium rounded-full transition-colors duration-300 bg-zinc-700 text-gray-300 hover:bg-zinc-600">
        Cancelar
      </button>
      <button 
        type="button" 
        (click)="onSubmit()"
        [disabled]="rating() === 0 || comment().trim() === ''"
        class="px-5 py-2 text-sm font-medium rounded-full transition-colors duration-300 bg-blue-600 text-white hover:bg-blue-500 disabled:bg-blue-800 disabled:cursor-not-allowed">
        Enviar Avaliação
      </button>
    </div>
  </div>
</div>
